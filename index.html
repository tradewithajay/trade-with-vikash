<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trade With Vikash — Daily Market Updates</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: #020304;
    color: #fff;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    position: relative;
    display: grid;
    place-items: center;
    padding: 30px 16px;
    isolation: isolate;
    overflow: hidden;
  }

  /* Stock-chart style background */
  .chart-bg {
    position: absolute;
    inset: -10%;
    z-index: -3;
    opacity: .62;
    background:
      radial-gradient(circle at 52% 48%, rgba(10, 39, 39, .35), transparent 38%),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, 74px 74px, 74px 74px;
    transform: perspective(800px) rotateX(9deg) scale(1.08);
  }

  .chart-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(63deg, transparent 0 18%, rgba(225,40,75,.22) 18.1% 18.7%, transparent 18.8% 28%,
        rgba(0,225,190,.2) 28.1% 28.7%, transparent 28.8% 39%,
        rgba(225,40,75,.20) 39.1% 39.7%, transparent 39.8% 51%,
        rgba(0,225,190,.20) 51.1% 51.7%, transparent 51.8% 63%,
        rgba(225,40,75,.20) 63.1% 63.7%, transparent 63.8% 100%);
    filter: blur(1px);
  }

  .chart-line {
    position: absolute;
    width: 130%;
    height: 3px;
    left: -15%;
    top: 42%;
    background: linear-gradient(90deg, transparent, #a12a45 14%, #17b8aa 34%, #b5294d 49%, #15bda9 66%, #b82d50 82%, transparent);
    transform: rotate(-7deg);
    filter: blur(1.5px);
    opacity: .55;
  }

  .veil {
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(circle at center, rgba(0,0,0,.08), rgba(0,0,0,.78) 72%),
      linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.78));
    backdrop-filter: blur(2px);
  }

  .card {
    width: min(378px, 92vw);
    min-height: 535px;
    padding: 36px 28px 24px;
    border: 1px solid rgba(255, 213, 0, .60);
    border-radius: 22px;
    background: rgba(20, 20, 20, .90);
    box-shadow:
      0 0 0 1px rgba(255,213,0,.05) inset,
      0 20px 70px rgba(0,0,0,.65);
    text-align: center;
    backdrop-filter: blur(12px);
  }

  .avatar-wrap {
    width: 112px;
    height: 112px;
    margin: 0 auto 26px;
    padding: 5px;
    border-radius: 50%;
    background: #ffd400;
    box-shadow: 0 0 18px rgba(255,212,0,.75), 0 0 42px rgba(255,212,0,.22);
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid #111;
  }

  h1 {
    margin: 0;
    color: #ffd400;
    font-size: clamp(25px, 7vw, 31px);
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -.5px;
    text-transform: lowercase;
  }

  .headline {
    margin: 13px 0 9px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: .2px;
  }

  .markets {
    margin: 0;
    color: #ddd;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .35px;
  }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    margin: 30px 20px 22px;
    border-radius: 16px;
    background: linear-gradient(100deg, #11bfe9, #0877db);
    color: white;
    text-decoration: none;
    font-weight: 900;
    font-size: 14px;
    box-shadow: 0 12px 28px rgba(0, 155, 235, .34);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }

  .cta:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 16px 34px rgba(0, 155, 235, .44);
  }

  .benefit {
    margin: 0 0 12px;
    color: #f4f4f4;
    font-size: 13px;
    font-weight: 650;
  }

  .sub {
    margin: 0;
    color: #f4f4f4;
    font-size: 13px;
    font-weight: 650;
  }

  .risk {
    margin: 24px 0 15px;
    color: #a9a9a9;
    font-size: 11px;
    font-weight: 500;
  }

  .ads {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    border: 1px solid #505050;
    border-radius: 7px;
    color: #16aee8;
    background: rgba(255,255,255,.045);
    font-size: 13px;
    font-weight: 900;
  }

  @media (max-width: 480px) {
    .page { padding: 18px 12px; }
    .card { padding: 30px 22px 22px; }
    .avatar-wrap { width: 104px; height: 104px; }
    .cta { margin-left: 8px; margin-right: 8px; }
  }

  /* --- Engagement + responsive motion layer --- */
  :root {
    --yellow: #ffd400;
    --cyan: #13c7f1;
    --blue: #0877db;
  }

  html { scroll-behavior: smooth; }

  body {
    min-width: 320px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page::before,
  .page::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
  }

  .page::before {
    width: 34vw;
    height: 34vw;
    min-width: 220px;
    min-height: 220px;
    max-width: 520px;
    max-height: 520px;
    left: -12vw;
    top: 8vh;
    background: radial-gradient(circle, rgba(255, 212, 0, .10), transparent 68%);
    animation: floatGlow 8s ease-in-out infinite;
  }

  .page::after {
    width: 40vw;
    height: 40vw;
    min-width: 250px;
    min-height: 250px;
    max-width: 600px;
    max-height: 600px;
    right: -15vw;
    bottom: -12vh;
    background: radial-gradient(circle, rgba(0, 191, 255, .11), transparent 68%);
    animation: floatGlow 10s ease-in-out infinite reverse;
  }

  .chart-bg {
    animation: chartDrift 18s linear infinite;
    transform-origin: center;
  }

  .chart-bg::after {
    content: "";
    position: absolute;
    width: 34%;
    height: 34%;
    left: 33%;
    top: 30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 212, 0, .08), transparent 65%);
    filter: blur(20px);
    animation: pulseGlow 4s ease-in-out infinite;
  }

  .chart-line {
    animation: lineFloat 7s ease-in-out infinite;
  }

  .card {
    position: relative;
    overflow: hidden;
    animation: cardIn .85s cubic-bezier(.2,.8,.2,1) both;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(255,212,0,.16) 35deg,
      transparent 70deg,
      transparent 180deg,
      rgba(0,200,255,.10) 215deg,
      transparent 255deg
    );
    animation: cardShimmer 10s linear infinite;
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    left: 50%;
    top: 88px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1px solid rgba(255,212,0,.18);
    box-shadow: 0 0 35px rgba(255,212,0,.08);
    animation: ringPulse 3.5s ease-in-out infinite;
    pointer-events: none;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .avatar-wrap {
    animation: avatarPop .9s .18s cubic-bezier(.2,.8,.2,1) both,
               avatarGlow 3s 1.1s ease-in-out infinite;
  }

  h1 {
    animation: textUp .7s .32s ease-out both;
  }

  .headline {
    animation: textUp .7s .42s ease-out both;
  }

  .markets {
    animation: textUp .7s .50s ease-out both;
  }

  .cta {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    animation: textUp .7s .62s ease-out both,
               ctaPulse 2.6s 1.5s ease-in-out infinite;
  }

  .cta::before {
    content: "";
    position: absolute;
    top: -40%;
    left: -45%;
    width: 32%;
    height: 180%;
    transform: rotate(22deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.62), transparent);
    animation: buttonSweep 3.4s 1.8s ease-in-out infinite;
  }

  .benefit, .sub, .risk, .ads {
    animation: textUp .7s .76s ease-out both;
  }

  .ads {
    transition: transform .2s ease, border-color .2s ease, color .2s ease;
  }

  .ads:hover {
    transform: translateY(-2px);
    border-color: rgba(19,199,241,.8);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(35px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes avatarPop {
    from { opacity: 0; transform: scale(.55) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }

  @keyframes avatarGlow {
    0%, 100% { box-shadow: 0 0 18px rgba(255,212,0,.70), 0 0 42px rgba(255,212,0,.20); }
    50% { box-shadow: 0 0 28px rgba(255,212,0,.95), 0 0 62px rgba(255,212,0,.30); }
  }

  @keyframes textUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 12px 28px rgba(0,155,235,.34); }
    50% { box-shadow: 0 14px 38px rgba(0,190,255,.52), 0 0 0 5px rgba(0,190,255,.04); }
  }

  @keyframes buttonSweep {
    0%, 58% { left: -45%; opacity: 0; }
    65% { opacity: 1; }
    82% { left: 125%; opacity: 1; }
    100% { left: 125%; opacity: 0; }
  }

  @keyframes chartDrift {
    0% { transform: perspective(800px) rotateX(9deg) scale(1.08) translate3d(0,0,0); }
    50% { transform: perspective(800px) rotateX(9deg) scale(1.11) translate3d(-18px,8px,0); }
    100% { transform: perspective(800px) rotateX(9deg) scale(1.08) translate3d(0,0,0); }
  }

  @keyframes lineFloat {
    0%, 100% { transform: rotate(-7deg) translateY(0); }
    50% { transform: rotate(-7deg) translateY(16px); }
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: .35; transform: scale(.88); }
    50% { opacity: .8; transform: scale(1.15); }
  }

  @keyframes floatGlow {
    0%, 100% { transform: translate3d(0,0,0); }
    50% { transform: translate3d(25px,-18px,0); }
  }

  @keyframes cardShimmer {
    to { transform: rotate(360deg); }
  }

  @keyframes ringPulse {
    0%, 100% { opacity: .25; transform: translateX(-50%) scale(.92); }
    50% { opacity: .65; transform: translateX(-50%) scale(1.08); }
  }

  /* Tablet */
  @media (min-width: 600px) and (max-width: 1024px) {
    .card {
      width: min(430px, 72vw);
      min-height: 570px;
      padding: 42px 34px 28px;
    }
    .cta { min-height: 54px; font-size: 15px; }
  }

  /* Small phones */
  @media (max-width: 430px) {
    .page { min-height: 100svh; padding: 16px 10px; }
    .card {
      width: min(100%, 380px);
      min-height: auto;
      padding: 27px 18px 20px;
      border-radius: 19px;
    }
    .avatar-wrap { width: 92px; height: 92px; margin-bottom: 20px; }
    .card::after { width: 145px; height: 145px; top: 70px; }
    h1 { font-size: clamp(24px, 8vw, 29px); }
    .headline { font-size: 15px; margin-top: 11px; }
    .markets, .benefit, .sub { font-size: 12px; }
    .cta { margin: 24px 2px 19px; min-height: 50px; font-size: 13px; }
    .risk { margin-top: 20px; font-size: 10px; }
    .ads { height: 34px; font-size: 12px; }
  }

  /* Very small phones */
  @media (max-width: 350px) {
    .page { padding: 10px 7px; }
    .card { padding: 23px 14px 17px; }
    .avatar-wrap { width: 82px; height: 82px; }
    h1 { font-size: 23px; }
    .headline { font-size: 14px; }
    .markets { font-size: 11px; }
    .cta { font-size: 12px; }
  }

  /* Respect accessibility preferences */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
